<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="异世界转生仪式：签下契约，自由分配灵魂点数，选择种族、出身、职业，并窥见另一段人生。"
    />
    <title>命运转生仪式</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <nav class="step-nav" aria-label="仪式进度">
        <span class="step-pill active" data-step-pill="contract">契约</span>
        <span class="step-pill" data-step-pill="weave">塑形</span>
        <span class="step-pill" data-step-pill="oracle">预言</span>
      </nav>

      <section class="page page-contract active" data-page="contract" aria-labelledby="contract-title">
        <div class="hero-art" aria-hidden="true">
          <div class="moon"></div>
          <div class="gate">
            <span></span>
            <span></span>
            <span></span>
          </div>
          <div class="constellation constellation-a"></div>
          <div class="constellation constellation-b"></div>
        </div>

        <div class="hero-copy">
          <p class="eyebrow">星门第七契约室</p>
          <h1 id="contract-title">命运转生仪式</h1>
          <p class="hero-text">
            你将离开旧日姓名，掷出灵魂的余烬。新的种族、出身、职业与能力会在星门另一侧重新排列。
          </p>
          <div class="contract-actions">
            <button class="primary-button large-button" id="begin-contract" type="button">定下契约</button>
            <button class="ghost-button large-button" id="peek-rules" type="button">查看代价</button>
          </div>
        </div>
      </section>

      <section class="page page-weave" data-page="weave" aria-labelledby="weave-title">
        <header class="page-header">
          <div>
            <p class="eyebrow">第二幕 · 灵魂塑形</p>
            <h2 id="weave-title">决定你在另一侧醒来时的模样</h2>
          </div>
        </header>

        <div class="weave-grid">
          <aside class="card identity-card">
            <div class="portrait" aria-hidden="true">
              <canvas id="sigil" width="360" height="360"></canvas>
            </div>
            <div class="identity-copy">
              <h3 id="hero-name">未命名的旅人</h3>
              <p id="hero-title">等待星门盖印</p>
            </div>
            <dl class="identity-list">
              <div>
                <dt>种族</dt>
                <dd id="race">--</dd>
              </div>
              <div>
                <dt>出身</dt>
                <dd id="origin">--</dd>
              </div>
              <div>
                <dt>相貌</dt>
                <dd id="appearance">--</dd>
              </div>
            </dl>
            <div class="identity-actions">
              <button class="ghost-button" id="reroll-identity" type="button">重掷身世</button>
              <button class="ghost-button" id="reroll-appearance" type="button">重掷相貌</button>
            </div>
          </aside>

          <section class="card choice-card" aria-labelledby="calling-title">
            <div class="card-header">
              <div>
                <p class="section-kicker">职业签</p>
                <h3 id="calling-title">选择醒来后的道路</h3>
              </div>
            </div>
            <div class="calling-options" id="calling-options"></div>
          </section>

          <section class="card stats-card" aria-labelledby="stats-title">
            <div class="card-header">
              <div>
                <p class="section-kicker">灵魂点数</p>
                <h3 id="stats-title">自由分配能力</h3>
              </div>
              <div class="score-cluster">
                <span>剩余</span>
                <output id="points-left" aria-label="剩余点数">0</output>
              </div>
            </div>
            <div class="pool-row">
              <span>本次可用点数：<strong id="point-pool">0</strong></span>
              <button class="ghost-button compact-button" id="reroll-points" type="button">重掷点数</button>
            </div>
            <div class="stat-editor" id="stat-editor"></div>
          </section>

          <section class="card fate-card" aria-labelledby="fate-title">
            <div class="card-header">
              <div>
                <p class="section-kicker">命运刻痕</p>
                <h3 id="fate-title">随身而来的三道印记</h3>
              </div>
              <button class="ghost-button compact-button" id="reroll-tags" type="button">重掷印记</button>
            </div>
            <div class="tag-board" id="tag-board"></div>
          </section>
        </div>

        <footer class="bottom-bar">
          <p id="weave-note">分配完所有点数后，星门才会开启最后一扇门。</p>
          <button class="primary-button" id="to-oracle" type="button">前往水晶球</button>
        </footer>
      </section>

      <section class="page page-oracle" data-page="oracle" aria-labelledby="oracle-title">
        <header class="page-header">
          <div>
            <p class="eyebrow">第三幕 · 水晶球前</p>
            <h2 id="oracle-title">让命运的水晶球预测你的一生</h2>
          </div>
          <button class="ghost-button" id="back-to-weave" type="button">返回调整</button>
        </header>

        <div class="oracle-grid">
          <aside class="card summary-card">
            <h3>契约书摘要</h3>
            <dl class="summary-list" id="summary-list"></dl>
          </aside>

          <section class="crystal-card" aria-label="水晶球预言">
            <div class="crystal-wrap" aria-hidden="true">
              <div class="crystal-ball"></div>
              <div class="crystal-base"></div>
            </div>
            <button class="primary-button large-button" id="generate-bio" type="button">
              用命运的水晶球预测你的一生
            </button>
            <div class="bio-output" id="bio-output">
              <p>水晶球尚未亮起。按下按钮后，它会显现另一段人生的开端。</p>
            </div>
          </section>
        </div>
      </section>
    </main>

    <div class="modal-backdrop" id="contract-modal" hidden>
      <section class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <p class="section-kicker" id="modal-step">确认 1 / 3</p>
        <h2 id="modal-title">契约确认</h2>
        <p id="modal-copy"></p>
        <div class="modal-actions">
          <button class="ghost-button" id="modal-cancel" type="button">暂不转生</button>
          <button class="primary-button" id="modal-confirm" type="button">继续确认</button>
        </div>
      </section>
    </div>

    <script defer src="./app.js"></script>
  </body>
</html>
